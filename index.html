<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for the safe-area padding on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Money Ledger</title>
    <meta name="description" content="A personal finance ledger that runs entirely on your own device." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/apple-touch-icon-167.png" />

    <!-- status bar follows the app's own light/dark theme -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7F9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090B" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Money Ledger" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
